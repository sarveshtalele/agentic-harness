name: Container image
# Not used: the owner chose App Service's built-in Python image without Docker (2026-11-14). Kept for a manual run only,
# until the owner decides whether to remove it and deploy/azure/Dockerfile.
on:
  workflow_dispatch:
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sarveshtalele/agentic-qe
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/azure/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
