name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # ubuntu-latest moved to the 26 beta, whose apt mirror failed
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements.txt
      - name: PostgreSQL binaries for the tests' throwaway cluster (Ubuntu and Windows images ship them)
        if: runner.os == 'macOS'
        run: |
          brew list postgresql@17 >/dev/null 2>&1 || brew install postgresql@17
          echo "PGBIN=$(brew --prefix postgresql@17)/bin" >> "$GITHUB_ENV"
      - run: pytest tests -q -m "not e2e and not live and not smoke"
      - run: npm ci
        working-directory: src/frontend
      - run: npx eslint .
        working-directory: src/frontend
      - run: npm run build
        working-directory: src/frontend
  smoke:
    # Browser tests that need no model: sign in, wrong password, navigation, access, empty states. Real-model runs stay local.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # ubuntu-latest moved to the 26 beta, whose apt mirror failed
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35  # on Windows, installing the browser and npm packages alone takes about 8 minutes; dev.py up builds the UI again
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements.txt
      - name: PostgreSQL binaries for the tests' throwaway cluster (Ubuntu and Windows images ship them)
        if: runner.os == 'macOS'
        run: |
          brew list postgresql@17 >/dev/null 2>&1 || brew install postgresql@17
          echo "PGBIN=$(brew --prefix postgresql@17)/bin" >> "$GITHUB_ENV"
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: src/frontend
      - run: python -m pytest tests/e2e -v -m smoke  # smoke tests and the stable build's feature walk (screenshots)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-walk-${{ matrix.os }}
          path: docs/evidence/stable-build/
          if-no-files-found: ignore
      - name: The documented start, end to end (dev.py up starts PostgreSQL, the backend, then the UI)
        run: python scripts/dev.py up
        env:
          ATLAS_UP_CHECK: "1"
          ATLAS_NO_BROWSER: "1"
          ATLAS_ADMIN_USERNAME: ci-admin
          ATLAS_ADMIN_PASSWORD: ci-start-check-${{ github.run_id }}

  azure-package:
    # The cloud build: both Azure zips are built, started through their own startup scripts in the web profile, checked
    # (API health 200, UI /login 200), and kept as an artifact. Deployment itself stays manual (azure-deploy.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: src/frontend
      - run: python scripts/dev.py azure-local --check
        env:
          ATLAS_ADMIN_USERNAME: ci-admin
          ATLAS_ADMIN_PASSWORD: ci-azure-check-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: azure-zips
          path: |
            dist/azure_backend.zip
            dist/azure_frontend.zip
          retention-days: 7

  evals-install:
    # RAGAS is optional (requirements-evals.txt). This job only shows whether it installs and imports on Windows, and may fail without failing the build.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-evals.txt
      - run: python -c "import ragas; from ragas.llms import llm_factory; from ragas.metrics.collections import Faithfulness, ContextRecall, ContextPrecision, FactualCorrectness; print('ragas', ragas.__version__)"
      - run: python -m pytest tests/test_evaluation_metrics_formulas.py tests/test_evaluation_metrics_grader.py tests/test_evaluation_metrics_store.py tests/test_evaluation_metrics_benchmark.py -q
