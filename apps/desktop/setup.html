<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Agentic QE Platform setup</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 28px; background: #f7f7f8; color: #1a1a1a; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: #555; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; }
  button { margin-top: 18px; padding: 9px 18px; font-size: 14px; }
  #error { color: #b00020; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<h1>Create the local administrator</h1>
<p>This account signs you in to the app on this computer. It is stored encrypted by your operating system.</p>
<form id="form">
  <label for="username">Username</label>
  <input id="username" autocomplete="username" required>
  <label for="password">Password (at least 12 characters)</label>
  <input id="password" type="password" autocomplete="new-password" required>
  <button id="save" type="submit">Save and start</button>
  <div id="error" role="alert"></div>
</form>
<script>
  document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const result = await window.setup.submit(document.getElementById("username").value, document.getElementById("password").value);
    if (result && result.error) document.getElementById("error").textContent = result.error;
  });
</script>
</body>
</html>
