<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Agentic QE Platform sign-in</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 28px; background: #f7f7f8; color: #1a1a1a; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: #555; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; }
  button { margin-top: 18px; padding: 9px 18px; font-size: 14px; }
  #error { color: #b00020; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<h1>Sign in to your team's server</h1>
<p>Accounts are created by your admin. The app keeps only a signed sign-in from the server, encrypted by your operating system, never your password.</p>
<form id="form">
  <label for="server">Server</label>
  <input id="server" type="url" placeholder="https://aqe.example.com" autocomplete="url" required>
  <label for="username">Username</label>
  <input id="username" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button id="save" type="submit">Sign in</button>
  <div id="error" role="alert"></div>
</form>
<script>
  const known = new URLSearchParams(location.search).get("server");
  if (known) document.getElementById("server").value = known;
  document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = document.getElementById("save"), error = document.getElementById("error");
    button.disabled = true;
    error.textContent = "";
    const result = await window.setup.submit(document.getElementById("server").value, document.getElementById("username").value, document.getElementById("password").value);
    button.disabled = false;
    if (result && result.error) error.textContent = result.error;
  });
</script>
</body>
</html>
