# The `aqh` command (docs/PHASE2_PLAN.md section 11.1). Install from this checkout:
#   python -m pip install -e .      (or: pipx install --editable .)
# The platform reads prompts/, skills/, plugins/ and migrations from the checkout, so the install is editable.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-qe-harness"
version = "0.1.0"
description = "Agentic QE Harness: a Claude Code-class harness on Microsoft Agent Framework, in your terminal"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
aqh = "aqh.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
include = ["aqh*", "backend*"]
