# ==============================================================================
# Azure DevOps Pipeline: Agentic QE Platform & Multi-Agent Harness
# Automated CI/CD, Kudu ZipDeploy Packaging & Azure App Service Deployment
# ==============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

pr:
  branches:
    include:
      - main

variables:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22.x'
  AZURE_SUBSCRIPTION_SERVICE_CONNECTION: 'azure-service-connection'
  AZURE_RESOURCE_GROUP: 'rg-agentic-harness-eastus2'
  AZURE_BACKEND_APP_NAME: 'agentic-harness-api'
  AZURE_FRONTEND_APP_NAME: 'agentic-harness-ui'

stages:
  # ----------------------------------------------------------------------------
  # Stage 1: Continuous Integration & Pre-flight Validation
  # ----------------------------------------------------------------------------
  - stage: ValidateAndTest
    displayName: 'Validate, Lint & Test'
    jobs:
      - job: BackendCI
        displayName: 'Backend CI (Python 3.12)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
            displayName: 'Set up Python $(PYTHON_VERSION)'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install Backend Dependencies'

          - script: |
              python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('src/backend/**/*.py', recursive=True)]"
            displayName: 'Compile Python Bytecode'

          - script: |
              pytest tests/ -q -m "not e2e" --ignore=node_modules
            displayName: 'Execute Core Unit Tests'
            env:
              ATLAS_RUN_TOKEN_LIMIT: '50000000'

      - job: FrontendCI
        displayName: 'Frontend CI (Next.js 16)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Set up Node.js $(NODE_VERSION)'

          - script: |
              cd src/frontend
              npm ci --no-audit --no-fund
            displayName: 'Install Frontend Dependencies'

          - script: |
              cd src/frontend
              npm run build
            displayName: 'Build Next.js Standalone Artifacts'
            env:
              NEXT_TELEMETRY_DISABLED: '1'
              NODE_OPTIONS: '--max-old-space-size=2048'

  # ----------------------------------------------------------------------------
  # Stage 2: Kudu ZipDeploy Packaging
  # ----------------------------------------------------------------------------
  - stage: PackageKudu
    displayName: 'Package Kudu ZipDeploy Archives'
    dependsOn: ValidateAndTest
    condition: succeeded()
    jobs:
      - job: BuildZipArtifacts
        displayName: 'Generate Deployment Bundles'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
            displayName: 'Set up Python'

          - script: |
              python scripts/package_azure_kudu.py
            displayName: 'Run Kudu Packaging Automation'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.SourcesDirectory)/dist/azure_backend.zip'
              artifact: 'azure_backend'
              publishLocation: 'pipeline'
            displayName: 'Publish Backend Kudu Bundle'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.SourcesDirectory)/dist/azure_frontend.zip'
              artifact: 'azure_frontend'
              publishLocation: 'pipeline'
            displayName: 'Publish Frontend Kudu Bundle'

  # ----------------------------------------------------------------------------
  # Stage 3: Continuous Deployment to Azure App Service
  # ----------------------------------------------------------------------------
  - stage: DeployToAzure
    displayName: 'Deploy to Azure App Service (eastus2)'
    dependsOn: PackageKudu
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployBackend
        displayName: 'Deploy Backend App Service'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production-azure-backend'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'azure_backend'

                - task: AzureWebApp@1
                  displayName: 'Deploy Backend to Azure App Service'
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION_SERVICE_CONNECTION)
                    appType: 'webAppLinux'
                    appName: $(AZURE_BACKEND_APP_NAME)
                    package: '$(Pipeline.Workspace)/azure_backend/azure_backend.zip'
                    deploymentMethod: 'zipDeploy'
                    appSettings: |
                      -WEBSITES_PORT 8000
                      -ATLAS_DATA_DIR /home/atlas/data
                      -ATLAS_KEY_VAULT_URL https://kv-agentic-harness.vault.azure.net
                      -ATLAS_RUN_TOKEN_LIMIT 50000000
                      -SCM_DO_BUILD_DURING_DEPLOYMENT true

      - deployment: DeployFrontend
        displayName: 'Deploy Frontend App Service'
        dependsOn: DeployBackend
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production-azure-frontend'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'azure_frontend'

                - task: AzureWebApp@1
                  displayName: 'Deploy Frontend to Azure App Service'
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION_SERVICE_CONNECTION)
                    appType: 'webAppLinux'
                    appName: $(AZURE_FRONTEND_APP_NAME)
                    package: '$(Pipeline.Workspace)/azure_frontend/azure_frontend.zip'
                    deploymentMethod: 'zipDeploy'
                    appSettings: |
                      -PORT 3000
                      -SCM_DO_BUILD_DURING_DEPLOYMENT true
